<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>CareOn Medical Clinic — Lab Test Billing</title>
<style>
  :root{
    --bg:#E6F3EE;
    --paper:#FFFFFF;
    --ink:#0B4D3D;
    --teal:#0F9D72;
    --teal-dark:#0C7A59;
    --stamp:#C0392B;
    --line:#CFE7DC;
    --muted:#4C7B6B;
    --muted-2:#87ADA0;
    --shadow: 0 1px 2px rgba(18,36,32,0.06), 0 8px 24px rgba(18,36,32,0.06);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:Arial,Helvetica,sans-serif;
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
    display:flex;
    justify-content:center;
  }
  #app{
    width:100%;
    max-width:480px;
    min-height:100vh;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    position:relative;
  }

  /* ---------- Header ---------- */
  header{
    padding:22px 20px 14px;
    position:sticky;
    top:0;
    background:var(--bg);
    z-index:20;
  }
  .eyebrow{
    font-family:Arial,Helvetica,sans-serif;
    font-size:11px;
    letter-spacing:0.14em;
    color:var(--teal-dark);
    text-transform:uppercase;
    display:flex;
    align-items:center;
    gap:8px;
  }
  .eyebrow::before{
    content:"";
    width:7px;height:7px;border-radius:50%;
    background:var(--stamp);
    display:inline-block;
  }
  h1{
    font-family:Arial,Helvetica,sans-serif;
    font-weight:bold;
    font-size:26px;
    letter-spacing:-0.01em;
    margin:4px 0 0;
    color:var(--ink);
  }
  h1 .hl-red{
    color:var(--stamp);
  }
  .sub{
    font-size:13px;
    color:var(--muted);
    margin-top:2px;
  }

  /* ---------- Clinic contact line ---------- */
  .clinic-contact{
    margin:8px 0 0;
    text-align:center;
    font-family:Arial,Helvetica,sans-serif;
    font-weight:bold;
    font-size:13px;
    letter-spacing:0.03em;
    color:#fff;
    background:var(--teal-dark);
    padding:7px 10px;
    border-radius:10px;
  }

  /* ---------- Patient Info ---------- */
  .patient-card{
    margin:0 20px 6px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:14px;
    box-shadow:var(--shadow);
    padding:14px 16px;
  }
  .patient-row{
    display:flex;
    align-items:baseline;
    gap:8px;
    padding:6px 0;
    border-bottom:1px dashed var(--line);
  }
  .patient-row:last-child{border-bottom:none;}
  .patient-row-split{gap:10px;}
  .p-label{
    font-family:Arial,Helvetica,sans-serif;
    font-size:12.5px;
    font-weight:bold;
    color:var(--muted);
    white-space:nowrap;
    flex:none;
  }
  .p-input{
    border:none;
    outline:none;
    background:transparent;
    font-family:Arial,Helvetica,sans-serif;
    font-size:14px;
    color:var(--ink);
    padding:2px 4px;
  }
  .p-input-wide{flex:1;}
  .p-input-sm{width:52px; flex:none;}

  /* ---------- Search ---------- */
  .search-wrap{
    padding:14px 20px 6px;
    position:sticky;
    top:88px;
    background:var(--bg);
    z-index:19;
  }
  .search-box{
    display:flex;
    align-items:center;
    background:var(--paper);
    border:1.5px solid var(--line);
    border-radius:14px;
    padding:0 14px;
    box-shadow:var(--shadow);
    transition:border-color .15s ease;
  }
  .search-box:focus-within{
    border-color:var(--teal);
  }
  .sync-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:6px 2px 0;
    font-size:11.5px;
    color:var(--muted);
    font-family:Arial,Helvetica,sans-serif;
  }
  #syncBtn{
    border:none;
    background:none;
    color:var(--teal-dark);
    font-weight:bold;
    font-size:12px;
    font-family:Arial,Helvetica,sans-serif;
    padding:2px 4px;
    cursor:pointer;
  }
  .search-box svg{flex:none;color:var(--muted-2);}
  #searchInput{
    flex:1;
    border:none;
    outline:none;
    background:transparent;
    font-family:Arial,Helvetica,sans-serif;
    font-size:16px;
    font-weight:500;
    padding:13px 10px;
    color:var(--ink);
  }
  #searchInput::placeholder{color:var(--muted-2); font-weight:400;}
  #clearSearch{
    border:none;background:none;color:var(--muted-2);
    font-size:18px; cursor:pointer; padding:4px 2px; display:none;
  }

  /* ---------- Results ---------- */
  .results{
    padding:8px 20px 4px;
    max-height:38vh;
    overflow-y:auto;
  }
  .result-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:12px;
    padding:11px 14px;
    margin-bottom:8px;
    cursor:pointer;
    transition:transform .1s ease, border-color .12s ease;
  }
  .result-row:active{ transform:scale(0.98); border-color:var(--teal); }
  .result-name{
    font-size:14px;
    font-weight:600;
    line-height:1.3;
  }
  .result-amt{
    font-family:Arial,Helvetica,sans-serif;
    font-weight:700;
    font-size:14px;
    color:var(--teal-dark);
    white-space:nowrap;
    flex:none;
  }
  .result-add{
    flex:none;
    width:26px;height:26px;
    border-radius:50%;
    background:var(--teal);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:16px;
    line-height:1;
  }
  .hint-row, .empty-row{
    text-align:center;
    color:var(--muted-2);
    font-size:13px;
    padding:16px 10px;
  }

  /* ---------- Divider label ---------- */
  .section-label{
    padding:14px 20px 6px;
    display:flex;
    align-items:baseline;
    justify-content:space-between;
  }
  .section-label span.tag{
    font-family:Arial,Helvetica,sans-serif;
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--muted);
  }
  #itemCount{
    font-family:Arial,Helvetica,sans-serif;
    font-size:11px;
    color:var(--teal-dark);
    background:rgba(14,110,92,0.1);
    padding:2px 8px;
    border-radius:20px;
  }

  /* ---------- Bill card (receipt) ---------- */
  .bill-wrap{
    padding:0 20px;
    flex:1;
  }
  .bill-card{
    background:var(--paper);
    border-radius:2px 2px 14px 14px;
    box-shadow:var(--shadow);
    position:relative;
    padding-top:14px;
    margin-bottom:12px;
  }
  .zigzag{
    position:absolute;
    top:-1px; left:0; right:0;
    height:10px;
    background:
      linear-gradient(135deg, var(--paper) 50%, transparent 50%) 0 0,
      linear-gradient(-135deg, var(--paper) 50%, transparent 50%) 0 0;
    background-size:14px 14px;
    background-repeat:repeat-x;
    filter:drop-shadow(0 -1px 1px rgba(18,36,32,0.05));
  }
  .bill-items{
    padding:4px 16px 6px;
    max-height:34vh;
    overflow-y:auto;
  }
  .bill-item{
    display:flex;
    align-items:center;
    gap:10px;
    padding:10px 0;
    border-bottom:1px dashed var(--line);
  }
  .bill-item:last-child{border-bottom:none;}
  .bill-sl{
    font-family:Arial,Helvetica,sans-serif;
    font-size:12px;
    color:var(--muted-2);
    width:20px;
    flex:none;
  }
  .bill-name{
    flex:1;
    font-size:13.5px;
    font-weight:600;
    line-height:1.3;
  }
  .bill-amt{
    font-family:Arial,Helvetica,sans-serif;
    font-weight:700;
    font-size:13.5px;
    flex:none;
  }
  .bill-remove{
    flex:none;
    border:none;background:none;
    color:var(--stamp);
    font-size:17px;
    cursor:pointer;
    padding:2px 0 2px 4px;
    opacity:0.75;
  }
  .bill-empty{
    padding:26px 10px 30px;
    text-align:center;
    color:var(--muted-2);
    font-size:13px;
    line-height:1.5;
  }

  /* ---------- Total footer ---------- */
  .total-bar{
    position:sticky;
    bottom:0;
    background:var(--teal-dark);
    color:#fff;
    padding:14px 20px calc(14px + env(safe-area-inset-bottom));
    border-radius:16px 16px 0 0;
    box-shadow:0 -6px 20px rgba(18,36,32,0.18);
    margin-top:auto;
  }
  .total-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:4px 0;
  }
  .total-row-net{
    margin-top:4px;
    padding-top:10px;
    border-top:1px solid rgba(255,255,255,0.2);
  }
  .t-label{
    font-family:Arial,Helvetica,sans-serif;
    font-size:12px;
    letter-spacing:0.06em;
    text-transform:uppercase;
    color:#A9E0CB;
  }
  .total-row-net .t-label{
    font-size:13px;
    font-weight:bold;
    color:#fff;
  }
  .t-value{
    font-family:Arial,Helvetica,sans-serif;
    font-weight:bold;
    font-size:16px;
    letter-spacing:-0.01em;
  }
  .t-net{
    font-size:24px;
  }
  .t-input-wrap{
    display:flex;
    align-items:center;
    gap:4px;
  }
  #discountInput{
    width:80px;
    border:none;
    border-bottom:1.5px solid rgba(255,255,255,0.4);
    background:transparent;
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    font-weight:bold;
    font-size:16px;
    padding:2px 4px;
    outline:none;
    text-align:right;
  }
  #discountInput:focus{border-bottom-color:#fff;}
  #clearAll{
    background:rgba(255,255,255,0.12);
    border:1px solid rgba(255,255,255,0.22);
    color:#fff;
    font-family:Arial,Helvetica,sans-serif;
    font-size:13px;
    font-weight:600;
    padding:8px 14px;
    border-radius:10px;
    cursor:pointer;
    margin-top:10px;
    width:100%;
  }
  #clearAll:active{background:rgba(255,255,255,0.2);}

  ::-webkit-scrollbar{width:5px;}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:10px;}

  @media (prefers-reduced-motion:reduce){
    .result-row{transition:none;}
  }
</style>
</head>

const searchInput = document.getElementById('searchInput');
const clearSearchBtn = document.getElementById('clearSearch');
const resultsEl = document.getElementById('results');
const billItemsEl = document.getElementById('billItems');
const billEmptyEl = document.getElementById('billEmpty');
const totalAmtEl = document.getElementById('totalAmt');
const itemCountEl = document.getElementById('itemCount');
const clearAllBtn = document.getElementById('clearAll');

let bill = []; // {name, amount}
let currentTotal = 0;

function formatRs(n){
  return 'Rs. ' + n.toLocaleString('en-IN');
}

function renderResults(){
  const q = searchInput.value.trim().toUpperCase();
  clearSearchBtn.style.display = q ? 'block' : 'none';
  resultsEl.innerHTML = '';

  if(!q){
    resultsEl.innerHTML = '<div class="hint-row">Start typing to search 815 tests…</div>';
    return;
  }

  const matches = TESTS.filter(t => t.name.includes(q)).slice(0, 40);

  if(matches.length === 0){
    resultsEl.innerHTML = '<div class="empty-row">No matching test found.</div>';
    return;
  }

  matches.forEach(t => {
    const row = document.createElement('div');
    row.className = 'result-row';
    row.innerHTML = `
      <div class="result-name">${t.name}</div>
      <div class="result-amt">${formatRs(t.amount)}</div>
      <div class="result-add">+</div>
    `;
    row.addEventListener('click', () => addToBill(t));
    resultsEl.appendChild(row);
  });
}

function addToBill(t){
  bill.push({name: t.name, amount: t.amount});
  renderBill();
  searchInput.value = '';
  renderResults();
  searchInput.focus();
}

function removeFromBill(idx){
  bill.splice(idx, 1);
  renderBill();
}

function renderBill(){
  itemCountEl.textContent = bill.length + (bill.length === 1 ? ' item' : ' items');

  if(bill.length === 0){
    billItemsEl.innerHTML = '';
    billItemsEl.appendChild(billEmptyEl);
    currentTotal = 0;
    totalAmtEl.textContent = formatRs(0);
    return;
  }

  billItemsEl.innerHTML = '';
  let total = 0;
  bill.forEach((item, i) => {
    total += item.amount;
    const row = document.createElement('div');
    row.className = 'bill-item';
    row.innerHTML = `
      <div class="bill-sl">${i + 1}.</div>
      <div class="bill-name">${item.name}</div>
      <div class="bill-amt">${formatRs(item.amount)}</div>
      <button class="bill-remove" aria-label="Remove">✕</button>
    `;
    row.querySelector('.bill-remove').addEventListener('click', () => removeFromBill(i));
    billItemsEl.appendChild(row);
  });

  currentTotal = total;
  totalAmtEl.textContent = formatRs(total);
}

searchInput.addEventListener('input', renderResults);
clearSearchBtn.addEventListener('click', () => {
  searchInput.value = '';
  renderResults();
  searchInput.focus();
});
searchInput.addEventListener('keydown', (e) => {
  if(e.key === 'Enter'){
    const first = resultsEl.querySelector('.result-row');
    if(first) first.click();
  }
});
clearAllBtn.addEventListener('click', () => {
  if(bill.length === 0) return;
  if(confirm('Clear all items from the bill?')){
    bill = [];
    renderBill();
  }
});

/* ---------- Live sync from Google Sheet ---------- */
const SHEET_ID = '1Zve1CCoApww70d_OgwdIA101QKyooXWVa_shFKb-cFU';
const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/' + SHEET_ID + '/export?format=csv&gid=0';
const syncStatusEl = document.getElementById('syncStatus');
const syncBtn = document.getElementById('syncBtn');

function parseCSV(text){
  const rows = [];
  let row = [], field = '', inQuotes = false;
  for(let i = 0; i < text.length; i++){
    const c = text[i];
    if(inQuotes){
      if(c === '"'){
        if(text[i+1] === '"'){ field += '"'; i++; }
        else { inQuotes = false; }
      } else {
        field += c;
      }
    } else {
      if(c === '"'){ inQuotes = true; }
      else if(c === ','){ row.push(field); field = ''; }
      else if(c === '\r'){ /* ignore */ }
      else if(c === '\n'){ row.push(field); rows.push(row); row = []; field = ''; }
      else { field += c; }
    }
  }
  if(field.length || row.length){ row.push(field); rows.push(row); }
  return rows;
}

function setSyncStatus(msg){
  if(syncStatusEl) syncStatusEl.textContent = msg;
}

async function syncFromSheet(silent){
  if(!silent) setSyncStatus('Syncing…');
  try{
    const res = await fetch(SHEET_CSV_URL, { cache: 'no-store' });
    if(!res.ok) throw new Error('HTTP ' + res.status);
    const text = await res.text();
    const rows = parseCSV(text);
    let startIdx = 0;
    if(rows.length && /test\s*name/i.test(rows[0][1] || '')) startIdx = 1;
    const newTests = [];
    for(let i = startIdx; i < rows.length; i++){
      const r = rows[i];
      if(!r || r.length < 3) continue;
      const sl = (r[0] || '').trim();
      const name = (r[1] || '').trim();
      const amtRaw = (r[2] || '').trim().replace(/,/g, '');
      const amount = parseFloat(amtRaw);
      if(!name || isNaN(amount)) continue;
      newTests.push({ sl, name: name.toUpperCase(), amount });
    }
    if(newTests.length > 0){
      TESTS = newTests;
      renderResults();
      const now = new Date();
      const hh = String(now.getHours()).padStart(2, '0');
      const mm = String(now.getMinutes()).padStart(2, '0');
      setSyncStatus('Synced ✓ ' + TESTS.length + ' tests (' + hh + ':' + mm + ')');
    } else {
      setSyncStatus('Sync failed — sheet returned no rows');
    }
  } catch(err){
    setSyncStatus('Offline — showing saved data');
  }
}

if(syncBtn) syncBtn.addEventListener('click', () => syncFromSheet(false));

renderResults();
renderBill();
syncFromSheet(true);
